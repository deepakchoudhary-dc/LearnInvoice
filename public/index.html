<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
  <title>Ledgerly – Offline Invoice Vault</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="vault-gate" class="gate" aria-live="polite"><section class="gate-card"><p class="eyebrow">LOCAL • OFFLINE • YOUR DATA</p><h1>Ledgerly Invoice Vault</h1><p id="gate-copy">Create a password to encrypt this device's invoice vault. Nothing is sent to a server.</p><label for="vault-password">Vault password</label><input id="vault-password" type="password" autocomplete="new-password" minlength="12" placeholder="At least 12 characters"><p id="gate-message" class="message"></p><button id="vault-submit" class="button primary">Unlock / create vault</button><button id="vault-demo" class="button link">Use a temporary demo (not saved)</button></section></div>
  <div id="app" class="shell" hidden><aside class="sidebar no-print"><div class="brand"><span class="brand-mark">L</span><span>Ledgerly</span></div><p class="sidebar-caption">Offline invoice vault</p><nav aria-label="Main navigation"><button class="nav active" data-page="dashboard">Overview</button><button class="nav" data-page="invoice">New document</button><button class="nav" data-page="documents">Documents</button><button class="nav" data-page="pos">Point of Sale</button><button class="nav" data-page="customers">Customers</button><button class="nav" data-page="products">Products & inventory</button><button class="nav" data-page="reports">Reports</button><button class="nav" data-page="expenses">Expenses</button><button class="nav" data-page="recurring">Recurring</button><button class="nav" data-page="backup">Business, backup & audit</button></nav><div class="sidebar-footer"><button id="lock-vault" class="button subtle full">Lock vault</button><small id="save-status">Local vault ready</small></div></aside><main class="main"><header class="topbar no-print"><div><p id="page-kicker" class="eyebrow">OVERVIEW</p><h1 id="page-title">Business at a glance</h1></div><div class="top-actions"><select id="company-switcher" aria-label="Active company"></select><button id="new-invoice" class="button primary">+ New document</button></div></header><section id="page-dashboard" class="page active"></section><section id="page-invoice" class="page"></section><section id="page-documents" class="page"></section><section id="page-pos" class="page"></section><section id="page-customers" class="page"></section><section id="page-products" class="page"></section><section id="page-reports" class="page"></section><section id="page-expenses" class="page"></section><section id="page-recurring" class="page"></section><section id="page-backup" class="page"></section></main></div>
  <script type="module" src="js/main.js"></script>
